<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Citekit · 知识工具工厂</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("citekit-theme") === "dark" ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
