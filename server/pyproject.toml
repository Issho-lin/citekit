[project]
name = "citekit-server"
version = "0.1.0"
description = "Citekit API: models, knowledge bases, retrieval tools, MCP"
readme = "README.md"
authors = [
    { name = "linqibin", email = "1479244157@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "minio>=7.2.20",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pymysql>=1.2.0",
    "pypdf>=6.17.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
citekit-server = "citekit_server.main:run"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
